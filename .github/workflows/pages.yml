name: Deploy to GitHub Pages

# Run manually (Actions → "Deploy to GitHub Pages" → Run workflow) or on pushes to main.
# Publishes the website (website/) at the root and the browser app at /app/.
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # the product website at the root, the browser version of the app under /app/
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r website/. _site/
          cp -r dist/. _site/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
