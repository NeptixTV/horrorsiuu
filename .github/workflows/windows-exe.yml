name: Build Windows .exe

# Builds "GoofyStudio-<version>-portable.exe" (no install needed) and
# "GoofyStudio-<version>-Setup.exe" (installer with desktop + start menu shortcut).
# Download them from the run page under "Artifacts". Pushing a tag like v1.0.0
# additionally publishes them as a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: GoofyStudio-Windows
          path: release/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
