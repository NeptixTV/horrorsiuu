name: Build Windows .exe

# Builds "GoofyStudio-<version>-portable.exe" (no install needed) and
# "GoofyStudio-<version>-Setup.exe" (installer with desktop + start menu shortcut).
# Download them from the run page under "Artifacts". Pushing a tag like v1.0.0
# additionally publishes them as a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: ['**', '!goofy-feed']
    tags: ['v*']

# Building only needs read access – npm packages run during "npm ci" never get a
# token that can write to the repository. Only the release job (tags) may write.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: GoofyStudio-Windows
          path: release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoofyStudio-Windows
          path: release
      - run: sha256sum release/*.exe | tee release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
